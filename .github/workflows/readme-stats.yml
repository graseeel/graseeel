name: Update README stats

on:
  schedule:
    # Once a day, off the hour, so GitHub is less likely to delay or drop the run.
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-stats
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&theme=github_dark&include_all_commits=true&disable_animations=true"
          path: profile/stats.svg
          token: ${{ github.token }}
          core_version: "2.2.1"
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=7&theme=github_dark&disable_animations=true"
          path: profile/top-langs.svg
          token: ${{ github.token }}
          core_version: "2.2.1"
          fail_on_error: true

      - name: Reject broken cards
        run: |
          set -euo pipefail
          for f in profile/stats.svg profile/top-langs.svg; do
            test -s "$f"
            grep -q '<svg' "$f"
            grep -q 'fill="#0D1117"' "$f"
            if grep -q -E 'Something went wrong|Maximum retries exceeded|PAT_1' "$f"; then
              echo "::error file=${f}::Refusing to commit an error card"
              exit 1
            fi
          done

      - name: Commit cards
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          if git diff --staged --quiet; then
            echo "No card changes."
            exit 0
          fi
          git commit -m "Update GitHub stats cards"
          git push origin "HEAD:${GITHUB_REF_NAME}"
